services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-destete}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-destete}
      POSTGRES_DB: ${POSTGRES_DB:-destete}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-destete}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-destete}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-destete}
      POSTGRES_DB: ${POSTGRES_DB:-destete}
      SECRET_KEY: ${SECRET_KEY:-cambiar-esta-clave-en-produccion}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-720}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@destete.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    volumes:
      - ./backend:/app
      - ./data:/app/data
    ports:
      - "${API_PORT:-8000}:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_URL: http://localhost:${API_PORT:-8000}/api/v1
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-4200}:4200"

volumes:
  db_data:
