<h2 mat-dialog-title>{{ data ? 'Editar alimento' : 'Nuevo alimento' }}</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="form-grid">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nombre / tipo</mat-label>
      <input matInput formControlName="nombre" placeholder="Ej: Hiper-Precoz 23%" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Costo de referencia ($/kg)</mat-label>
      <input matInput type="number" formControlName="costo_kg_referencia" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Kg por bolsa</mat-label>
      <input matInput type="number" formControlName="kg_por_bolsa" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Descripción</mat-label>
      <textarea matInput formControlName="descripcion" rows="2"></textarea>
    </mat-form-field>

    <mat-slide-toggle formControlName="activo" class="full-width">Activo</mat-slide-toggle>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancelar()">Cancelar</button>
  <button mat-flat-button color="primary" (click)="guardar()">Guardar</button>
</mat-dialog-actions>
