<h2 mat-dialog-title>Movimiento de stock — {{ data.nombre }}</h2>
<mat-dialog-content>
  <p class="page-hint" style="margin-top:0">Stock actual: <strong>{{ data.stock_actual_kg }} kg</strong></p>
  <form [formGroup]="form" class="form-grid">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Tipo de movimiento</mat-label>
      <mat-select formControlName="tipo">
        <mat-option value="entrada">Entrada (compra / ingreso)</mat-option>
        <mat-option value="ajuste">Ajuste (corrección de conteo)</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Fecha</mat-label>
      <input matInput [matDatepicker]="picker" formControlName="fecha" />
      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Cantidad (kg)</mat-label>
      <input matInput type="number" formControlName="cantidad_kg" />
      @if (form.value.tipo === 'ajuste') {
        <mat-hint>Positivo suma, negativo resta</mat-hint>
      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Costo total ($)</mat-label>
      <input matInput type="number" formControlName="costo_total" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Proveedor</mat-label>
      <input matInput formControlName="proveedor" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Observaciones</mat-label>
      <input matInput formControlName="observaciones" />
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancelar()">Cancelar</button>
  <button mat-flat-button color="primary" (click)="guardar()">Guardar</button>
</mat-dialog-actions>
