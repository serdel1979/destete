<mat-sidenav-container class="app-container">
  <mat-sidenav
    #sidenav
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="!isMobile()"
    class="sidenav"
  >
    <div class="brand">🐄 Control de Destete</div>
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active" (click)="isMobile() && sidenav.close()">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Resumen</span>
      </a>
      <a mat-list-item routerLink="/estadisticas" routerLinkActive="active" (click)="isMobile() && sidenav.close()">
        <mat-icon matListItemIcon>bar_chart</mat-icon>
        <span matListItemTitle>Estadísticas</span>
      </a>
      <a mat-list-item routerLink="/lotes" routerLinkActive="active" (click)="isMobile() && sidenav.close()">
        <mat-icon matListItemIcon>grid_view</mat-icon>
        <span matListItemTitle>Lotes</span>
      </a>
      <a mat-list-item routerLink="/animales" routerLinkActive="active" (click)="isMobile() && sidenav.close()">
        <mat-icon matListItemIcon>pets</mat-icon>
        <span matListItemTitle>Animales</span>
      </a>
      <a mat-list-item routerLink="/alimentos" routerLinkActive="active" (click)="isMobile() && sidenav.close()">
        <mat-icon matListItemIcon>grass</mat-icon>
        <span matListItemTitle>Alimentos</span>
      </a>
      <a mat-list-item routerLink="/ventas" routerLinkActive="active" (click)="isMobile() && sidenav.close()">
        <mat-icon matListItemIcon>sell</mat-icon>
        <span matListItemTitle>Ventas</span>
      </a>
      <a mat-list-item routerLink="/ayuda" routerLinkActive="active" (click)="isMobile() && sidenav.close()">
        <mat-icon matListItemIcon>help_outline</mat-icon>
        <span matListItemTitle>Ayuda</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      @if (isMobile()) {
        <button mat-icon-button (click)="sidenav.toggle()" aria-label="Abrir menú">
          <mat-icon>menu</mat-icon>
        </button>
      }
      @if (isMobile()) {
        <span class="brand-toolbar">🐄 Control de Destete</span>
      }
      <span class="spacer"></span>
      <span class="user">{{ auth.session()?.nombre }}</span>
      <button mat-icon-button (click)="auth.logout()" title="Salir">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>
    <div class="content">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
