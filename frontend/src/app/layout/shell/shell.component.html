<mat-sidenav-container class="app-container">
  <mat-sidenav mode="side" opened class="sidenav">
    <div class="brand">🐄 Control de Destete</div>
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Resumen</span>
      </a>
      <a mat-list-item routerLink="/lotes" routerLinkActive="active">
        <mat-icon matListItemIcon>grid_view</mat-icon>
        <span matListItemTitle>Lotes</span>
      </a>
      <a mat-list-item routerLink="/animales" routerLinkActive="active">
        <mat-icon matListItemIcon>pets</mat-icon>
        <span matListItemTitle>Animales</span>
      </a>
      <a mat-list-item routerLink="/ventas" routerLinkActive="active">
        <mat-icon matListItemIcon>sell</mat-icon>
        <span matListItemTitle>Ventas</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary">
      <span class="spacer"></span>
      <span class="user">{{ auth.session()?.nombre }}</span>
      <button mat-icon-button (click)="auth.logout()" title="Salir">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>
    <div class="content">
      <router-outlet />
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
